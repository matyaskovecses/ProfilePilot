<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title>
<style>label { display: block; margin: 4px 0; } iframe { width: 460px; height: 170px; border: 1px solid #ccc; }</style>
</head>
<body>
<h1>Checkout</h1>
<form id="pay">
  <label>Email for the receipt <input type="email" name="receipt"></label>
  <label>Name on card <input name="ccname"></label>
  <!-- Stripe-style card fields live in a cross-site iframe (served by a second origin server) -->
  <iframe id="card-frame" title="Secure card payment input frame" src="{{CARD_ORIGIN}}/card_frame.html"></iframe>
  <label>Billing ZIP <input name="billing_zip"></label>
  <button type="submit">Pay</button>
</form>
</body>
</html>
