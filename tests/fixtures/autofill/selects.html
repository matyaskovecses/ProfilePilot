<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Selects</title>
<style>label, fieldset { display: block; margin: 4px 0; }</style>
</head>
<body>
<h1>Shipping and payment</h1>
<form id="sel">
  <!-- The region list is loaded asynchronously after a country is chosen (it comes first in the
       document, so autofill has to come back to it). -->
  <label>State / Province
    <select name="region"><option value="">Select a country first</option></select>
  </label>
  <label>Country
    <select name="country">
      <option value="">Select country</option>
      <option value="CAN">Canada</option><option value="DEU">Germany</option>
      <option value="USA">United States of America</option><option value="UMI">United States Minor Outlying Islands</option>
    </select>
  </label>
  <label>Expiry month
    <select name="exp_month">
      <option value="">MM</option>
      <option value="1">01 - Jan</option><option value="2">02 - Feb</option><option value="3">03 - Mar</option>
      <option value="4">04 - Apr</option><option value="5">05 - May</option><option value="6">06 - Jun</option>
      <option value="7">07 - Jul</option><option value="8">08 - Aug</option><option value="9">09 - Sep</option>
      <option value="10">10 - Oct</option><option value="11">11 - Nov</option><option value="12">12 - Dec</option>
    </select>
  </label>
  <label>Expiry year
    <select name="exp_year">
      <option value="">YYYY</option>
      <option value="26">2026</option><option value="27">2027</option><option value="28">2028</option>
      <option value="29">2029</option><option value="30">2030</option><option value="31">2031</option>
      <option value="32">2032</option><option value="33">2033</option>
    </select>
  </label>
  <fieldset>
    <legend>Date of birth</legend>
    <select name="dob_day"></select>
    <select name="dob_month">
      <option value="">Month</option>
      <option value="1">January</option><option value="2">February</option><option value="3">March</option>
      <option value="4">April</option><option value="5">May</option><option value="6">June</option>
      <option value="7">July</option><option value="8">August</option><option value="9">September</option>
      <option value="10">October</option><option value="11">November</option><option value="12">December</option>
    </select>
    <select name="dob_year"></select>
  </fieldset>
  <label>Gender
    <select name="gender">
      <option value="">Prefer not to say</option><option value="m">Male</option>
      <option value="f">Female</option><option value="x">Other</option>
    </select>
  </label>
  <label>Card type
    <select name="cardtype">
      <option value="">Choose…</option><option value="AX">American Express</option>
      <option value="MC">MasterCard</option><option value="VI">Visa</option>
    </select>
  </label>
</form>
<script>
  const day = document.querySelector('[name=dob_day]');
  day.add(new Option('Day', ''));
  for (let d = 1; d <= 31; d++) day.add(new Option(String(d), String(d)));
  const year = document.querySelector('[name=dob_year]');
  year.add(new Option('Year', ''));
  for (let y = 2010; y >= 1930; y--) year.add(new Option(String(y), String(y)));
  const REGIONS = {
    USA: [['AL', 'Alabama'], ['CA', 'California'], ['NY', 'New York'], ['TX', 'Texas']],
    CAN: [['BC', 'British Columbia'], ['ON', 'Ontario'], ['QC', 'Québec']],
  };
  const country = document.querySelector('[name=country]');
  const region = document.querySelector('[name=region]');
  country.addEventListener('change', () => {
    setTimeout(() => {
      region.innerHTML = '';
      region.add(new Option('Select…', ''));
      for (const [code, name] of REGIONS[country.value] || []) region.add(new Option(name, code));
    }, 300);
  });
</script>
</body>
</html>
